# nginx gateway - mirrors the hosted Supabase API surface.
#
# Path-routes the three prefixes the app uses to the matching service, with
# the prefix stripped (the trailing slash on proxy_pass does the strip):
#   /auth/v1/*    -> gotrue     (e.g. /auth/v1/token   -> /token)
#   /rest/v1/*    -> postgrest  (e.g. /rest/v1/care_circle -> /care_circle)
#   /storage/v1/* -> storage    (e.g. /storage/v1/object/... -> /object/...)
#
# Auth is enforced downstream by the JWT (PostgREST maps the token's `role`
# claim to a Postgres role; GoTrue checks admin JWTs). The `apikey` header is
# accepted and forwarded but not gated here - add Kong or an nginx key check
# if you want the hosted platform's apikey enforcement + per-key rate limits.
#
# CORS: the dashboard makes some calls to Supabase directly from the browser
# (clinical reads, vault list, token refresh), so the gateway answers
# preflight and echoes the Origin. RESTRICT `$cors_origin` to your app's
# origin(s) in production instead of reflecting every Origin.

map $http_origin $cors_origin {
  default $http_origin;   # reflect - tighten to an allowlist in production
}

server {
  listen 8000;
  server_name _;

  # Vault uploads are up to 25 MB plaintext; allow headroom for multipart +
  # GCM overhead.
  client_max_body_size 50m;

  location /auth/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth:9999/;
    include /etc/nginx/conf.d/_proxy.inc;
  }

  location /rest/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://rest:3000/;
    include /etc/nginx/conf.d/_proxy.inc;
  }

  location /storage/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://storage:5000/;
    include /etc/nginx/conf.d/_proxy.inc;
  }

  # Health probe for load balancers.
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # CORS headers on every response (including the 204 preflights above).
  add_header Access-Control-Allow-Origin  $cors_origin       always;
  add_header Access-Control-Allow-Credentials true           always;
  add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
  add_header Access-Control-Allow-Headers "authorization,apikey,content-type,prefer,x-client-info,x-upsert,range,x-alert-signature,x-alert-timestamp" always;
  add_header Access-Control-Expose-Headers "content-range,content-disposition" always;
}
